name: Beny NG Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: |
            platforms;android-37
            build-tools;37.0.0
            platform-tools

      - name: Install NDK
        shell: bash
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            "ndk;29.0.14206865"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build libhevtun
        shell: bash
        run: |
          set -e
          bash compile-hevtun.sh

      - name: Copy libhevtun
        shell: bash
        run: |
          set -e
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/

      - name: Fetch AndroidLibXrayLite tag
        shell: bash
        run: |
          set -e

          cd AndroidLibXrayLite

          CURRENT_TAG=$(git describe --tags --abbrev=0)

          echo "Current AndroidLibXrayLite tag: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "2dust/AndroidLibXrayLite"
          tag: ${{ env.CURRENT_TAG }}
          fileName: "libv2ray.aar"
          out-file-path: "V2rayNG/app/libs"

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Apply Beny NG name and glass look
        shell: bash
        run: |
          set -e

          D="V2rayNG/app/src/debug"

          mkdir -p "$D/java/ir/beny/ng"

          cat > "$D/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <application
                  android:label="Beny NG"
                  tools:replace="android:label">

                  <provider
                      android:name="ir.beny.ng.BenyGlassProvider"
                      android:authorities="${applicationId}.beny.glass"
                      android:exported="false"
                      android:initOrder="100" />

              </application>

          </manifest>
          EOF

          cat > "$D/java/ir/beny/ng/BenyGlass.kt" <<'EOF'
          package ir.beny.ng

          import android.app.Activity
          import android.app.Application
          import android.content.ContentProvider
          import android.content.ContentValues
          import android.content.res.Configuration
          import android.database.Cursor
          import android.graphics.Color
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.view.View
          import android.view.ViewGroup
          import java.util.WeakHashMap

          class BenyGlassProvider : ContentProvider() {

              override fun onCreate(): Boolean {
                  (context?.applicationContext as? Application)
                      ?.registerActivityLifecycleCallbacks(BenyGlass)

                  return true
              }

              override fun query(
                  uri: Uri,
                  projection: Array<out String>?,
                  selection: String?,
                  selectionArgs: Array<out String>?,
                  sortOrder: String?
              ): Cursor? = null

              override fun getType(uri: Uri): String? = null

              override fun insert(
                  uri: Uri,
                  values: ContentValues?
              ): Uri? = null

              override fun delete(
                  uri: Uri,
                  selection: String?,
                  selectionArgs: Array<out String>?
              ): Int = 0

              override fun update(
                  uri: Uri,
                  values: ContentValues?,
                  selection: String?,
                 
